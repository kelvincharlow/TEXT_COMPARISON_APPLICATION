name: postbank-document-comparison

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postbank}
      POSTGRES_USER: ${POSTGRES_USER:-postbank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTBANK_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment: &database-environment
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-postbank}
      POSTGRES_USER: ${POSTGRES_USER:-postbank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *database-environment
      POSTBANK_STORAGE_ROOT: /app/data
      POSTBANK_COOKIE_SECURE: ${POSTBANK_COOKIE_SECURE:-false}
      POSTBANK_MAX_UPLOAD_BYTES: ${POSTBANK_MAX_UPLOAD_BYTES:-26214400}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=1073741824,mode=1777
    volumes:
      - engine-cache:/app/engine-cache
      - document-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: ${POSTBANK_BACKEND_MEMORY_LIMIT:-2g}
    cpus: ${POSTBANK_BACKEND_CPU_LIMIT:-2.0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${POSTBANK_BIND_ADDRESS:-127.0.0.1}:${POSTBANK_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16777216,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: ${POSTBANK_FRONTEND_MEMORY_LIMIT:-128m}
    cpus: ${POSTBANK_FRONTEND_CPU_LIMIT:-0.5}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres-data:
  document-data:
  engine-cache:
